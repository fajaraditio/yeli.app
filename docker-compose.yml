services:
  app:
    build: .
    user: 1000:1000
    container_name: yeli_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./backup:/var/backup
      - ./php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - yeli

  queue:
    build: .
    container_name: yeli_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./src:/var/www
      - ./backup:/var/backup
      - ./php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    depends_on:
      - app
      - redis
      - db
    networks:
      - yeli

  scheduler:
    build: .
    container_name: yeli_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www
      - ./backup:/var/backup
    depends_on:
      - app
      - redis
      - db
    networks:
      - yeli

  nginx:
    image: nginx:alpine
    container_name: yeli_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./src:/var/www
      - ./nginx/default:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - yeli

  db:
    image: mariadb:10.6
    container_name: yeli_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./backup:/backup
    networks:
      - yeli

  redis:
    image: redis:alpine
    container_name: yeli_redis
    restart: unless-stopped
    networks:
      - yeli

networks:
  yeli:

volumes:
  dbdata:
